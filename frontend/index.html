<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AnalystOS: the analyst that shows its work. Ask business questions of your data and get answers where every number is verified and traceable to the query that produced it."
    />
    <meta name="theme-color" content="#0d0d0f" />
    <title>AnalystOS</title>
    <script>
      try {
        var t = localStorage.getItem('analystos.theme')
        if (t === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
