# Render Blueprint for the AnalystOS backend on Render's free plan (no card needed). The web app is served by
# Vercel (frontend/vercel.json rewrites /api here); the model is any OpenAI-compatible API (Groq's free tier by
# default). Fill the `sync: false` values in the Render dashboard, or create the services through the Render API.
#
# PostgreSQL (pgvector) and Redis run inside the same container (deploy/render/Dockerfile), so no separate free
# database is needed (Render allows one per workspace, and it expires after 30 days).
# Free-plan limits: the service sleeps after 15 idle minutes (the next request waits for it to start), it has 512 MB
# of memory (measured peak about 420 MB with an analysis and a PDF report), and its disk is ephemeral: every start
# re-creates the database with the demo account and sample datasets. There is no Docker daemon or isolation layer
# for generated Python, so the Python tool is disabled (SANDBOX_ENABLED=false); SQL, statistics, anomaly detection,
# charts, verification and reports all work.

services:
  - type: web
    name: analystos-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
        sync: false
      - key: RUN_ANALYSES_INLINE
        value: "true"
      - key: SANDBOX_ENABLED
        value: "false"
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_API_KEY  # Groq API key (console.groq.com)
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "300"
      - key: EMBEDDING_BASE_URL
        value: ""
      - key: QUESTIONS_PER_HOUR  # per user; keeps the free LLM quota for everyone
        value: "10"
      - key: METRICS_ENABLED
        value: "false"
      - key: LOG_JSON
        value: "true"
