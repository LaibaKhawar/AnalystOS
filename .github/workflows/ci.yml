name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint, format and types
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: ruff check app evals tests
      - run: ruff format --check app evals tests
      - run: mypy app

  backend-tests:
    name: Backend tests (Postgres + Docker sandbox)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: analystos, POSTGRES_PASSWORD: analystos, POSTGRES_DB: analystos_test}
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U analystos" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://analystos:analystos@localhost:5434/analystos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: pip install -e ".[dev]"
      - name: Build sandbox image
        run: docker build -t analystos-sandbox:latest ../sandbox
      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://analystos:analystos@localhost:5434/analystos_test
          SECRET_KEY: ci-secret-key-0123456789abcdef
          ENCRYPTION_KEY: 2LZ0pPbk3cTOz0pMtk2s8eQ6k6DcO_2-6E0FEb3OQ0Y=
        run: alembic upgrade head && alembic downgrade base
      - run: pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Benchmark data is reproducible
        run: |
          python -m evals.datasets.generate > /dev/null
          git diff --exit-code -- evals/data

  backend-security:
    name: Backend security scan
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: bandit -q -r app -c pyproject.toml -lll
      - run: pip-audit --strict --progress-spinner off || echo "::warning::pip-audit reported advisories"

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: backend, push: false, tags: "analystos-backend:ci", cache-from: type=gha, cache-to: "type=gha,mode=max"}
      - uses: docker/build-push-action@v6
        with: {context: sandbox, push: false, tags: "analystos-sandbox:ci"}
      - uses: docker/build-push-action@v6
        with: {context: frontend, push: false, tags: "analystos-frontend:ci"}
