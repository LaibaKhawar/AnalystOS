name: Demo (GitHub Pages)

# Publishes the read-only replay demo: the frontend serving recorded API responses (frontend/public/replay.json,
# made with frontend/scripts/record-replay.mjs). No backend or model runs on Pages.
on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run build:replay
      - uses: actions/upload-pages-artifact@v3
        with: {path: frontend/dist-replay}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
