[project]
name = "analystos"
version = "1.0.0"
description = "AnalystOS backend: an autonomous, evidence-backed data analyst agent."
requires-python = ">=3.11"
authors = [{ name = "Laiba Khawar" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pymysql>=1.1",
  "cryptography>=43",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "duckdb>=1.1",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "charset-normalizer>=3.3",
  "sqlglot>=25.20",
  "docker>=7.1",
  "jinja2>=3.1",
  "matplotlib>=3.9",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "sse-starlette>=2.1",
  "pyyaml>=6.0",
  "email-validator>=2.2",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "types-pyyaml",
  "types-redis",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]
ignore = ["S101", "S608", "B008", "RUF012", "S311", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PT011", "PT018", "E501"]
"evals/**" = ["S105"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["alembic/", "tests/", "evals/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "docker: requires a running Docker daemon (sandbox tests)",
  "postgres: requires a PostgreSQL test database",
  "mysql: requires a MySQL test database",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests", "evals"]
skips = ["B101", "B608"]
